<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.403.title}">403 - 权限不足</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: #f8f9fa;">
    <div class="text-center">
        <h1 class="display-1 text-muted">403</h1>
        <h3 class="mb-3"><i class="fas fa-lock text-danger"></i> <span th:text="#{error.403}">权限不足</span></h3>
        <p class="text-muted mb-4" th:text="${errorMessage} ?: #{error.403.message}"></p>
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="fas fa-home"></i> <span th:text="#{error.back.home}">返回首页</span>
        </a>
    </div>
</body>
</html>
