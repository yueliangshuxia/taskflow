<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <div>
            <h2><i class="fas fa-tasks"></i> 任务管理</h2>
            <p>查看和管理系统中所有任务</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body py-3">
            <form method="get" th:action="@{/admin/tasks}" class="row g-2 align-items-center">
                <div class="col-auto">
                    <select name="status" class="form-select form-select-sm">
                        <option value="">全部状态</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.displayName}"
                                th:selected="${s.name() == selectedStatus}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-filter"></i> 筛选</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标题</th>
                            <th>状态</th>
                            <th>优先级</th>
                            <th>项目</th>
                            <th>指派人</th>
                            <th>创建者</th>
                            <th>创建时间</th>
                            <th class="text-end">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasks}">
                            <td class="text-muted fw-semibold" th:text="${task.id}">1</td>
                            <td><a th:href="@{/tasks/{id}(id=${task.id})}" class="text-decoration-none fw-bold" th:text="${task.title}">任务标题</a></td>
                            <td><span th:class="'badge badge-' + ${task.status.name().toLowerCase().replace('_', '-')}" th:text="${task.status.displayName}">状态</span></td>
                            <td><span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}" th:text="${task.priority.displayName}">优先级</span></td>
                            <td th:text="${task.project != null ? task.project.name : '-'}" class="text-muted">项目</td>
                            <td th:text="${task.assignee != null ? task.assignee.displayName : '未指派'}" class="text-muted">指派人</td>
                            <td th:text="${task.creator.displayName}">创建者</td>
                            <td class="small text-muted" th:text="${#temporals.format(task.createdAt, 'MM-dd HH:mm')}">时间</td>
                            <td class="text-end">
                                <form method="post" th:action="@{/admin/tasks/{id}/delete(id=${task.id})}"
                                      onsubmit="return confirm('确定要删除此任务吗？')" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tasks)}">
                            <td colspan="9" class="text-center text-muted py-4"><i class="fas fa-inbox me-2"></i>暂无任务</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer" th:if="${totalPages > 1}">
            <nav>
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/tasks(page=${currentPage - 1}, status=${selectedStatus})}"><i class="fas fa-chevron-left"></i></a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/tasks(page=${i}, status=${selectedStatus})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/tasks(page=${currentPage + 1}, status=${selectedStatus})}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
