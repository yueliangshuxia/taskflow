<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-users"></i> <span th:text="#{admin.users.title}">用户管理</span></h2>
                <p th:text="#{admin.users.subtitle}">管理系统所有用户账号和权限</p>
            </div>
            <a th:href="@{/admin/users/create}" class="btn btn-light">
                <i class="fas fa-plus"></i> <span th:text="#{admin.users.create}">创建用户</span>
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th th:text="#{admin.users.id}">ID</th>
                            <th th:text="#{admin.users.username}">用户名</th>
                            <th th:text="#{admin.users.display.name}">显示名称</th>
                            <th th:text="#{admin.users.email}">邮箱</th>
                            <th th:text="#{admin.users.role}">角色</th>
                            <th th:text="#{admin.users.status}">状态</th>
                            <th th:text="#{admin.users.created.at}">创建时间</th>
                            <th class="text-end" th:text="#{admin.users.actions}">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-semibold text-muted" th:text="${user.id}">1</td>
                            <td><i class="fas fa-user-circle text-primary me-1"></i> <span th:text="${user.username}">user</span></td>
                            <td th:text="${user.displayName}">显示名</td>
                            <td class="text-muted" th:text="${user.email}">email</td>
                            <td>
                                <span th:class="'badge ' + (${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary')"
                                      th:text="${user.role.displayName}">角色</span>
                            </td>
                            <td>
                                <span th:class="'badge ' + (${user.enabled} ? 'bg-success' : 'bg-warning')"
                                      th:text="${user.enabled} ? #{admin.users.enabled} : #{admin.users.disabled}">状态</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-outline-primary"
                                       th:title="#{admin.users.edit.btn}"><i class="fas fa-edit"></i></a>
                                    <form method="post" th:action="@{/admin/users/{id}/role(id=${user.id})}" class="d-inline">
                                        <input type="hidden" name="role" th:value="${user.role.name() == 'ADMIN'} ? 'USER' : 'ADMIN'">
                                        <button type="submit" class="btn btn-outline-warning"
                                                th:title="${user.role.name() == 'ADMIN'} ? #{admin.users.demote} : #{admin.users.promote}">
                                            <i class="fas" th:class="${user.role.name() == 'ADMIN'} ? 'fa-arrow-down' : 'fa-arrow-up'"></i>
                                        </button>
                                    </form>
                                    <form method="post" th:action="@{/admin/users/{id}/delete(id=${user.id})}" class="d-inline"
                                          th:onsubmit="'return confirm(\'' + #{admin.users.delete.confirm} + ' ' + user.username + '?\')'">
                                        <button type="submit" class="btn btn-outline-danger" th:title="#{admin.users.delete}"><i class="fas fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" class="text-center text-muted py-4"><i class="fas fa-inbox me-2"></i><span th:text="#{admin.users.no.data}">暂无用户数据</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer" th:if="${totalPages > 1}">
            <nav>
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1})}"><i class="fas fa-chevron-left"></i></a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1})}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
