<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header rounded-3 mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid">
            <h2><i class="fas fa-history"></i> <span th:text="#{admin.logs.title}">审计日志</span></h2>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-sm">
                    <thead>
                        <tr>
                            <th th:text="#{admin.users.id}">ID</th>
                            <th th:text="#{admin.logs.action}">操作</th>
                            <th th:text="#{admin.logs.entity.type}">对象类型</th>
                            <th th:text="#{admin.logs.entity.id}">对象ID</th>
                            <th th:text="#{admin.logs.details}">详情</th>
                            <th th:text="#{admin.logs.operator}">操作者</th>
                            <th th:text="#{admin.logs.time}">时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${log.id}">1</td>
                            <td>
                                <span class="badge bg-success" th:if="${log.action == 'CREATE' or log.action == 'REGISTER'}" th:text="${log.action}">操作</span>
                                <span class="badge bg-danger" th:if="${log.action == 'DELETE'}" th:text="${log.action}">操作</span>
                                <span class="badge bg-warning text-dark" th:if="${log.action == 'CHANGE_ROLE' or log.action == 'UPDATE_STATUS'}" th:text="${log.action}">操作</span>
                                <span class="badge bg-primary" th:if="${log.action == 'ADD_MEMBER' or log.action == 'REMOVE_MEMBER'}" th:text="${log.action}">操作</span>
                                <span class="badge bg-secondary" th:if="${log.action == 'RESET_ID'}" th:text="${log.action}">操作</span>
                                <span class="badge bg-info" th:if="${log.action != 'CREATE' and log.action != 'REGISTER' and log.action != 'DELETE' and log.action != 'CHANGE_ROLE' and log.action != 'UPDATE_STATUS' and log.action != 'ADD_MEMBER' and log.action != 'REMOVE_MEMBER' and log.action != 'RESET_ID'}" th:text="${log.action}">操作</span>
                            </td>
                            <td th:text="${log.entityType}">对象类型</td>
                            <td th:text="${log.entityId}">对象ID</td>
                            <td class="small text-muted" th:text="${log.details}">详情</td>
                            <td th:text="${log.performedBy}">操作者</td>
                            <td class="small" th:text="${log.performedAt}">时间</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="7" class="text-center text-muted" th:text="#{admin.logs.no.data}">暂无日志记录</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/logs(page=${currentPage - 1})}" th:text="#{pagination.previous}">上一页</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/logs(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/logs(page=${currentPage + 1})}" th:text="#{pagination.next}">下一页</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
