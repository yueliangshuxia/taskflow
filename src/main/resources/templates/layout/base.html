<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title th:text="${title} ?: #{nav.site.title}">TaskFlow</title>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" sec:authorize="isAuthenticated()">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-tasks"></i> TaskFlow
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="fas fa-home"></i> <span th:text="#{nav.home}">首页</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/my-tasks}">
                            <i class="fas fa-tasks"></i> <span th:text="#{nav.my.tasks}">我的任务</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/projects}">
                            <i class="fas fa-folder"></i> <span th:text="#{nav.projects}">项目</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/calendar}">
                            <i class="fas fa-calendar-alt"></i> <span th:text="#{nav.calendar}">日历</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="fas fa-cog"></i> <span th:text="#{nav.admin}">管理</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><h6 class="dropdown-header" th:text="#{nav.admin.system}">系统管理</h6></li>
                            <li><a class="dropdown-item" th:href="@{/admin/dashboard}">
                                <i class="fas fa-chart-bar"></i> <span th:text="#{nav.admin.dashboard}">管理仪表盘</span></a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users}">
                                <i class="fas fa-users"></i> <span th:text="#{nav.admin.users}">用户管理</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><h6 class="dropdown-header" th:text="#{nav.admin.content}">内容管理</h6></li>
                            <li><a class="dropdown-item" th:href="@{/admin/projects}">
                                <i class="fas fa-folder-open"></i> <span th:text="#{nav.admin.projects}">项目管理</span></a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/tasks}">
                                <i class="fas fa-tasks"></i> <span th:text="#{nav.admin.tasks}">任务管理</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/admin/logs}">
                                <i class="fas fa-history"></i> <span th:text="#{nav.admin.logs}">审计日志</span></a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link position-relative" th:href="@{/messages}">
                            <i class="fas fa-envelope"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                  style="font-size: 0.6rem; display: none;" id="messageBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" th:title="#{theme.switch}">
                            <i class="fas fa-globe"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><h6 class="dropdown-header" th:text="#{theme.title}">语言</h6></li>
                            <li><a class="dropdown-item" href="#" onclick="switchLanguage('zh'); return false;">中文</a></li>
                            <li><a class="dropdown-item" href="#" onclick="switchLanguage('en'); return false;">English</a></li>
                        </ul>
                    </li>
                    <!-- Theme Toggle -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="themeToggle" onclick="toggleTheme(); return false;" title="切换暗色模式">
                            <i class="fas fa-moon"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">
                            <i class="fas fa-user-circle"></i>
                            <span sec:authentication="name"></span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <form method="post" th:action="@{/logout}" class="d-inline">
                            <button type="submit" class="nav-link border-0 bg-transparent">
                                <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">退出</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container-fluid py-4">
        <!-- Alert Messages -->
        <th:block th:if="${message}">
            <div class="alert alert-success alert-dismissible fade show fade-in" role="alert">
                <i class="fas fa-check-circle"></i> <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>
        <th:block th:if="${error}">
            <div class="alert alert-danger alert-dismissible fade show fade-in" role="alert">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <!-- Main Content -->
        <th:block th:replace="${content}"></th:block>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3">
        <div class="container-fluid text-center">
            <span class="text-muted">
                <i class="fas fa-tasks"></i> TaskFlow &copy; 2026 - 任务管理系统
            </span>
        </div>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/theme.js"></script>
    <script>ThemeManager.load();</script>
    <script>
    function switchLanguage(lang) {
        var url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
    // WebSocket connection (auto-connect if authenticated)
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof Stomp !== 'undefined' && document.querySelector('meta[name="_csrf"]')) {
            setTimeout(function() {
                try {
                    var socket = new SockJS('/ws');
                    var stompClient = Stomp.over(socket);
                    stompClient.connect({}, function() {
                        console.log('WebSocket connected');
                    });
                } catch(e) {
                    console.log('WebSocket not available');
                }
            }, 1000);
        }
    });
    </script>
</body>
</html>
