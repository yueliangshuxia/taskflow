<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header rounded-3 mb-4">
        <div class="container-fluid">
            <h2><i class="fas fa-user-cog"></i> <span th:text="#{profile.title}">个人资料</span></h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-info-circle"></i> <span th:text="#{profile.basic.info}">基本信息</span></h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/profile}">
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label" th:text="#{profile.username}">用户名</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" th:value="${user.username}" readonly disabled>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label" th:text="#{profile.display.name}">显示名称</label>
                            <div class="col-sm-9">
                                <input type="text" name="displayName" class="form-control"
                                       th:value="${user.displayName}" th:placeholder="#{profile.display.name.placeholder}" placeholder="你的显示名称">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label" th:text="#{profile.email}">邮箱</label>
                            <div class="col-sm-9">
                                <input type="email" name="email" class="form-control"
                                       th:value="${user.email}" placeholder="your@email.com" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label" th:text="#{profile.role}">角色</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control"
                                       th:value="${user.role.displayName}" readonly disabled>
                            </div>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> <span th:text="#{profile.save}">保存修改</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-key"></i> <span th:text="#{profile.change.password}">修改密码</span></h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/profile/password}">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{profile.current.password}">当前密码</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{profile.new.password}">新密码</label>
                            <input type="password" name="newPassword" class="form-control" required minlength="6">
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-key"></i> <span th:text="#{profile.change.password.btn}">修改密码</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
