<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-columns"></i> <span th:text="${project.name}">项目名</span> - 看板</h2>
                <p class="mb-0">拖拽任务卡片以更新状态</p>
            </div>
            <div>
                <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-light btn-sm me-1">
                    <i class="fas fa-list"></i> 任务列表
                </a>
                <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-success btn-sm">
                    <i class="fas fa-plus"></i> 新建任务
                </a>
            </div>
        </div>
    </div>

    <div class="row g-3" id="kanban-board">
        <!-- TODO -->
        <div class="col-md-3">
            <div class="kanban-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 fw-bold">
                        <span class="badge badge-todo me-2">待办</span>
                        <span class="badge bg-secondary rounded-pill" id="count-TODO"
                              th:text="${#lists.size(todoTasks)}">0</span>
                    </h5>
                </div>
                <div class="sortable-list min-vh-50" data-status="TODO">
                    <th:block th:if="${#lists.isEmpty(todoTasks)}">
                        <div class="text-center text-muted py-4 empty-hint">
                            <i class="fas fa-inbox fa-2x mb-2"></i>
                            <p class="mb-0 small">暂无</p>
                        </div>
                    </th:block>
                    <div th:each="task : ${todoTasks}"
                         class="card kanban-card mb-2"
                         th:classappend="'priority-' + ${task.priority.name()}"
                         th:attr="data-task-id=${task.id}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a th:href="@{/tasks/{id}(id=${task.id})}"
                                   class="text-decoration-none fw-bold text-dark stretched-link"
                                   th:text="${task.title}">任务标题</a>
                            </div>
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                      th:text="${task.priority.displayName}">优先级</span>
                            </div>
                            <div class="small text-muted d-flex flex-wrap gap-2">
                                <span th:if="${task.assigneeName}"><i class="fas fa-user"></i> <span th:text="${task.assigneeName}">指派人</span></span>
                                <span th:if="${task.dueDate}"><i class="fas fa-calendar"></i> <span th:text="${task.dueDate}">截止日</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- IN_PROGRESS -->
        <div class="col-md-3">
            <div class="kanban-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 fw-bold">
                        <span class="badge badge-in-progress me-2">进行中</span>
                        <span class="badge bg-secondary rounded-pill" id="count-IN_PROGRESS"
                              th:text="${#lists.size(inProgressTasks)}">0</span>
                    </h5>
                </div>
                <div class="sortable-list min-vh-50" data-status="IN_PROGRESS">
                    <th:block th:if="${#lists.isEmpty(inProgressTasks)}">
                        <div class="text-center text-muted py-4 empty-hint">
                            <i class="fas fa-spinner fa-2x mb-2"></i>
                            <p class="mb-0 small">暂无</p>
                        </div>
                    </th:block>
                    <div th:each="task : ${inProgressTasks}"
                         class="card kanban-card mb-2"
                         th:classappend="'priority-' + ${task.priority.name()}"
                         th:attr="data-task-id=${task.id}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a th:href="@{/tasks/{id}(id=${task.id})}"
                                   class="text-decoration-none fw-bold text-dark stretched-link"
                                   th:text="${task.title}">任务标题</a>
                            </div>
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                      th:text="${task.priority.displayName}">优先级</span>
                            </div>
                            <div class="small text-muted d-flex flex-wrap gap-2">
                                <span th:if="${task.assigneeName}"><i class="fas fa-user"></i> <span th:text="${task.assigneeName}">指派人</span></span>
                                <span th:if="${task.dueDate}"><i class="fas fa-calendar"></i> <span th:text="${task.dueDate}">截止日</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- IN_REVIEW -->
        <div class="col-md-3">
            <div class="kanban-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 fw-bold">
                        <span class="badge badge-in-progress me-2">审核</span>
                        <span class="badge bg-secondary rounded-pill" id="count-IN_REVIEW"
                              th:text="${#lists.size(inReviewTasks)}">0</span>
                    </h5>
                </div>
                <div class="sortable-list min-vh-50" data-status="IN_REVIEW">
                    <th:block th:if="${#lists.isEmpty(inReviewTasks)}">
                        <div class="text-center text-muted py-4 empty-hint">
                            <i class="fas fa-search fa-2x mb-2"></i>
                            <p class="mb-0 small">暂无</p>
                        </div>
                    </th:block>
                    <div th:each="task : ${inReviewTasks}"
                         class="card kanban-card mb-2"
                         th:classappend="'priority-' + ${task.priority.name()}"
                         th:attr="data-task-id=${task.id}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a th:href="@{/tasks/{id}(id=${task.id})}"
                                   class="text-decoration-none fw-bold text-dark stretched-link"
                                   th:text="${task.title}">任务标题</a>
                            </div>
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                      th:text="${task.priority.displayName}">优先级</span>
                            </div>
                            <div class="small text-muted d-flex flex-wrap gap-2">
                                <span th:if="${task.assigneeName}"><i class="fas fa-user"></i> <span th:text="${task.assigneeName}">指派人</span></span>
                                <span th:if="${task.dueDate}"><i class="fas fa-calendar"></i> <span th:text="${task.dueDate}">截止日</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DONE -->
        <div class="col-md-3">
            <div class="kanban-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 fw-bold">
                        <span class="badge badge-done me-2">完成</span>
                        <span class="badge bg-secondary rounded-pill" id="count-DONE"
                              th:text="${#lists.size(doneTasks)}">0</span>
                    </h5>
                </div>
                <div class="sortable-list min-vh-50" data-status="DONE">
                    <th:block th:if="${#lists.isEmpty(doneTasks)}">
                        <div class="text-center text-muted py-4 empty-hint">
                            <i class="fas fa-check-circle fa-2x mb-2"></i>
                            <p class="mb-0 small">暂无</p>
                        </div>
                    </th:block>
                    <div th:each="task : ${doneTasks}"
                         class="card kanban-card mb-2"
                         th:classappend="'priority-' + ${task.priority.name()}"
                         th:attr="data-task-id=${task.id}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a th:href="@{/tasks/{id}(id=${task.id})}"
                                   class="text-decoration-none fw-bold text-dark stretched-link"
                                   th:text="${task.title}">任务标题</a>
                            </div>
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                      th:text="${task.priority.displayName}">优先级</span>
                            </div>
                            <div class="small text-muted d-flex flex-wrap gap-2">
                                <span th:if="${task.assigneeName}"><i class="fas fa-user"></i> <span th:text="${task.assigneeName}">指派人</span></span>
                                <span th:if="${task.dueDate}"><i class="fas fa-calendar"></i> <span th:text="${task.dueDate}">截止日</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue + SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
    (function() {
        if (typeof Vue === 'undefined') return;
        var boardEl = document.getElementById('kanban-board');
        if (!boardEl) return;

        function getBadge(status) {
            return document.getElementById('count-' + status);
        }

        function updateCount(col) {
            if (!col) return;
            var list = col.querySelector('.sortable-list');
            var status = list?.getAttribute('data-status');
            var cards = list?.querySelectorAll('.kanban-card') || [];
            var badge = status && getBadge(status);
            if (badge) badge.textContent = cards.length;
            var hint = col.querySelector('.empty-hint');
            if (hint) hint.style.display = cards.length === 0 ? 'block' : 'none';
        }

        Vue.createApp({
            setup: function() {
                Vue.onMounted(function() {
                    document.querySelectorAll('.sortable-list').forEach(function(el) {
                        new Sortable(el, {
                            group: 'kanban',
                            animation: 200,
                            ghostClass: 'kanban-ghost',
                            dragClass: 'kanban-drag',
                            onEnd: function(evt) {
                                var taskId = evt.item.getAttribute('data-task-id');
                                var newStatus = evt.to.getAttribute('data-status');
                                var fromCol = evt.from.closest('.kanban-column');
                                var toCol = evt.to.closest('.kanban-column');

                                updateCount(fromCol);
                                updateCount(toCol);
                                evt.item.style.opacity = '0.6';

                                var headers = {};
                                headers[getCsrfHeader()] = getCsrfToken();
                                headers['Content-Type'] = 'application/json';

                                fetch('/api/tasks/' + taskId + '/status', {
                                    method: 'POST',
                                    headers: headers,
                                    body: JSON.stringify({ status: newStatus })
                                })
                                .then(function(r) { return r.json(); })
                                .then(function(data) {
                                    evt.item.style.opacity = '1';
                                    if (data.success) {
                                        if (typeof showToast === 'function') showToast('状态已更新', 'success');
                                    } else {
                                        throw new Error(data.message || 'Update failed');
                                    }
                                })
                                .catch(function() {
                                    evt.item.style.opacity = '1';
                                    if (typeof showToast === 'function') showToast('更新失败', 'danger');
                                    var fromList = fromCol.querySelector('.sortable-list');
                                    if (fromList) {
                                        fromList.appendChild(evt.item);
                                        updateCount(fromCol);
                                        updateCount(toCol);
                                    }
                                });
                            }
                        });
                    });
                });
                return {};
            }
        }).mount('#kanban-board');
    })();
    </script>
</div>
</body>
</html>
