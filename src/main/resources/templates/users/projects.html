<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-folder"></i> <span th:text="#{project.list}">我的项目</span></h2>
            <a th:href="@{/projects/create}" class="btn btn-light">
                <i class="fas fa-plus"></i> <span th:text="#{project.create}">创建项目</span>
            </a>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(projects)}">
        <div class="empty-state">
            <img src="/images/empty-projects.svg" alt="No projects" style="width: 200px; height: 160px;">
            <h4 class="mt-3" th:text="#{project.no.projects}">还没有项目</h4>
            <p th:text="#{project.no.projects.desc}">创建一个新项目来开始管理你的任务</p>
            <a th:href="@{/projects/create}" class="btn btn-primary">
                <i class="fas fa-plus"></i> <span th:text="#{project.create}">创建项目</span>
            </a>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(projects)}">
        <div class="row g-4">
            <div th:each="project : ${projects}" class="col-md-4">
                <div class="card h-100 fade-in">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="rounded-circle bg-primary bg-opacity-10 p-3 me-3">
                                <i class="fas fa-folder-open text-primary fa-lg"></i>
                            </div>
                            <div>
                                <h5 class="card-title mb-0">
                                    <a th:href="@{/projects/{id}(id=${project.id})}"
                                       class="text-decoration-none stretched-link" th:text="${project.name}">项目名称</a>
                                </h5>
                            </div>
                        </div>
                        <p class="card-text text-muted small mb-3" th:text="${project.description} ?: #{project.no.desc}">
                        </p>
                    </div>
                    <div class="card-footer bg-transparent border-top-0">
                        <div class="d-flex justify-content-between text-muted small">
                            <span><i class="fas fa-tasks"></i> <span th:text="${project.taskCount}">0</span> <span th:text="#{project.tasks}">任务</span></span>
                            <span><i class="fas fa-users"></i> <span th:text="${project.memberCount}">0</span> <span th:text="#{project.members}">成员</span></span>
                            <span><i class="fas fa-user"></i> <span th:text="${project.ownerName}">owner</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/projects(page=${currentPage - 1})}"><i class="fas fa-chevron-left"></i></a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/projects(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/projects(page=${currentPage + 1})}"><i class="fas fa-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </th:block>
</div>
</body>
</html>
