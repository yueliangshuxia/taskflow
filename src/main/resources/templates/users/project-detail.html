<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="javascript:history.back()" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left"></i> <span th:text="#{common.back}">返回</span>
                </a>
                <div>
                    <h2 class="mb-0"><i class="fas fa-folder-open"></i> <span th:text="${project.name}">项目名</span></h2>
                    <p class="mb-0" th:text="${project.description} ?: #{project.no.desc}"></p>
                </div>
            </div>
            <div>
                <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-light btn-sm me-1">
                    <i class="fas fa-edit"></i> <span th:text="#{project.edit}">编辑</span>
                </a>
                <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-success btn-sm">
                    <i class="fas fa-plus"></i> <span th:text="#{task.create}">新建任务</span>
                </a>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-tasks text-primary"></i> <span th:text="#{project.task.list}">任务列表</span></span>
                    <div class="d-flex gap-2 align-items-center">
                        <a href="#" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#taskFilterBar" th:title="#{common.filter}">
                            <i class="fas fa-filter"></i>
                        </a>
                        <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-sm btn-success">
                            <i class="fas fa-plus"></i> <span th:text="#{task.create}">新建</span>
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <div class="collapse" id="taskFilterBar">
                        <div id="vue-task-filter" v-cloak class="position-relative">
                            <!-- Loading overlay -->
                            <div v-if="filtering" class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
                                 style="background: rgba(255,255,255,0.7); z-index: 10; border-radius: var(--radius);">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                <span class="small text-muted">{{ t('common.loading', '筛选...') }}</span>
                            </div>
                            <form ref="filterForm" method="get" th:action="@{/projects/{id}(id=${project.id})}" class="mb-3 p-3 bg-light rounded">
                                <input type="hidden" name="page" value="0">
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <input type="text" name="keyword" class="form-control form-control-sm"
                                               th:placeholder="#{project.filter.search}" placeholder="搜索任务标题或描述..."
                                               th:value="${filter.keyword}">
                                    </div>
                                    <div class="col-md-2">
                                        <select name="status" class="form-select form-select-sm">
                                            <option value="" th:text="#{project.filter.all.status}">全部状态</option>
                                            <option value="TODO" th:selected="${filter.status == 'TODO'}" th:text="#{task.status.todo}">待办</option>
                                            <option value="IN_PROGRESS" th:selected="${filter.status == 'IN_PROGRESS'}" th:text="#{task.status.in_progress}">进行中</option>
                                            <option value="IN_REVIEW" th:selected="${filter.status == 'IN_REVIEW'}" th:text="#{task.status.in_review}">审核中</option>
                                            <option value="DONE" th:selected="${filter.status == 'DONE'}" th:text="#{task.status.done}">已完成</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <select name="priority" class="form-select form-select-sm">
                                            <option value="" th:text="#{project.filter.all.priority}">全部优先级</option>
                                            <option value="LOW" th:selected="${filter.priority == 'LOW'}" th:text="#{task.priority.low}">低</option>
                                            <option value="MEDIUM" th:selected="${filter.priority == 'MEDIUM'}" th:text="#{task.priority.medium}">中</option>
                                            <option value="HIGH" th:selected="${filter.priority == 'HIGH'}" th:text="#{task.priority.high}">高</option>
                                            <option value="URGENT" th:selected="${filter.priority == 'URGENT'}" th:text="#{task.priority.urgent}">紧急</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <select name="assigneeId" class="form-select form-select-sm">
                                            <option value="" th:text="#{project.filter.all.assignee}">全部负责人</option>
                                            <option th:each="m : ${members}" th:value="${m.id}"
                                                    th:text="${m.displayName}"
                                                    th:selected="${filter.assigneeId == m.id}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="submit" class="btn btn-sm btn-primary w-100" :disabled="filtering">
                                            <i class="fas fa-search"></i> <span th:text="#{project.filter.search.btn}">搜索</span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <th:block th:if="${#lists.isEmpty(tasks)}">
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list"></i>
                            <h4 th:text="#{project.no.tasks}">暂无任务</h4>
                            <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-success">
                                <i class="fas fa-plus"></i> <span th:text="#{project.create.first.task}">创建第一个任务</span>
                            </a>
                        </div>
                    </th:block>
                    <div th:unless="${#lists.isEmpty(tasks)}" class="list-group list-group-flush">
                        <a th:each="task : ${tasks}"
                             th:href="@{/tasks/{id}(id=${task.id})}"
                             class="list-group-item list-group-item-action px-0"
                             th:classappend="'priority-' + ${task.priority.name()}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="fw-bold" th:text="${task.title}">任务标题</span>
                                    <div class="mt-1">
                                        <span th:class="'badge badge-' + ${task.status.name().toLowerCase().replace('_', '-')}"
                                              th:text="${task.status.displayName}">状态</span>
                                        <span th:class="'badge badge-' + ${task.priority.name().toLowerCase()}"
                                              th:text="${task.priority.displayName}">优先级</span>
                                    </div>
                                </div>
                                <div class="text-end text-muted small">
                                    <div th:if="${task.assigneeName}">
                                        <i class="fas fa-user"></i> <span th:text="${task.assigneeName}">指派人</span>
                                    </div>
                                    <div th:if="${task.dueDate}">
                                        <i class="fas fa-calendar"></i> <span th:text="${task.dueDate}">截止日</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header"><i class="fas fa-info-circle text-primary"></i> <span th:text="#{project.info}">项目信息</span></div>
                <div class="card-body">
                    <table class="table table-borderless mb-0">
                        <tr><td class="ps-0 text-muted" th:text="#{project.creator}">创建者</td><td class="pe-0 text-end fw-semibold" th:text="${project.ownerName}">owner</td></tr>
                        <tr><td class="ps-0 text-muted" th:text="#{project.task.count}">任务数</td><td class="pe-0 text-end fw-semibold"><span th:text="${project.taskCount}">0</span></td></tr>
                        <tr><td class="ps-0 text-muted" th:text="#{project.member.count}">成员数</td><td class="pe-0 text-end fw-semibold"><span th:text="${project.memberCount}">0</span></td></tr>
                    </table>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header"><i class="fas fa-users text-success"></i> <span th:text="#{project.members}">成员</span></div>
                <div class="card-body">
                    <th:block th:if="${#lists.isEmpty(members)}">
                        <p class="text-muted mb-0" th:text="#{project.no.members}">暂无成员</p>
                    </th:block>
                    <ul th:unless="${#lists.isEmpty(members)}" class="list-unstyled mb-0">
                        <li th:each="member : ${members}" class="py-1 d-flex justify-content-between align-items-center">
                            <span>
                                <i class="fas fa-user-circle text-primary me-2"></i>
                                <span th:text="${member.displayName}">成员名</span>
                                <small class="text-muted" th:if="${member.username == project.ownerName}" th:text="#{project.owner}">(所有者)</small>
                            </span>
                            <form th:if="${currentUsername == project.ownerName and member.username != project.ownerName}"
                                  method="post" th:action="@{/projects/{id}/members/remove(id=${project.id})}"
                                  class="d-inline">
                                <input type="hidden" name="userId" th:value="${member.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm py-0"
                                        th:onclick="'return confirm(\'' + #{project.remove.member} + '\')'">
                                    <i class="fas fa-times"></i>
                                </button>
                            </form>
                        </li>
                    </ul>

                    <hr th:if="${currentUsername == project.ownerName and not #lists.isEmpty(availableUsers)}">
                    <form th:if="${currentUsername == project.ownerName and not #lists.isEmpty(availableUsers)}"
                          method="post" th:action="@{/projects/{id}/members/add(id=${project.id})}"
                          class="d-flex gap-2">
                        <select name="userId" class="form-select form-select-sm" required>
                            <option value="" th:text="#{project.select.user}">选择用户...</option>
                            <option th:each="user : ${availableUsers}"
                                    th:value="${user.id}"
                                    th:text="${user.displayName + ' (' + user.username + ')'}"></option>
                        </select>
                        <button type="submit" class="btn btn-success btn-sm flex-shrink-0">
                            <i class="fas fa-plus"></i> <span th:text="#{project.add.member}">添加</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-cog text-secondary"></i> <span th:text="#{project.actions}">操作</span></div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-success"><i class="fas fa-plus"></i> <span th:text="#{project.create.task}">创建任务</span></a>
                        <a th:href="@{/projects/{id}/gantt(id=${project.id})}" class="btn btn-outline-info"><i class="fas fa-chart-bar"></i> <span th:text="#{project.gantt}">甘特图</span></a>
                        <a th:href="@{/export/project/{id}/tasks/excel(id=${project.id})}" class="btn btn-outline-success"><i class="fas fa-file-excel"></i> <span th:text="#{project.export.excel}">导出Excel</span></a>
                        <a th:href="@{/export/project/{id}/tasks/csv(id=${project.id})}" class="btn btn-outline-secondary"><i class="fas fa-file-csv"></i> <span th:text="#{project.export.csv}">导出CSV</span></a>
                        <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-outline-primary"><i class="fas fa-edit"></i> <span th:text="#{project.edit}">编辑项目</span></a>
                        <form method="post" th:action="@{/projects/{id}/delete(id=${project.id})}"
                              th:onsubmit="'return confirm(\'' + #{project.delete.confirm} + '\')'">
                            <button type="submit" class="btn btn-outline-danger w-100"><i class="fas fa-trash"></i> <span th:text="#{project.delete}">删除项目</span></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue: Task Filter auto-submit -->
    <script>
    (function() {
        if (typeof Vue === 'undefined') return;
        var filterEl = document.getElementById('vue-task-filter');
        if (!filterEl) return;

        var _t = window.__messages || {};
        function t(key, fallback) { return _t[key] || fallback || key; }

        Vue.createApp({
            setup: function() {
                var filtering = Vue.ref(false);
                var formEl = Vue.ref(null);
                var debounceTimer = null;

                function autoSubmit() {
                    if (!formEl.value) return;
                    if (debounceTimer) clearTimeout(debounceTimer);
                    filtering.value = true;
                    debounceTimer = setTimeout(function() {
                        formEl.value.submit();
                    }, 400);
                }

                Vue.onMounted(function() {
                    var form = filterEl.querySelector('form');
                    if (!form) return;
                    formEl.value = form;

                    // Listen for changes on select/input fields
                    var inputs = form.querySelectorAll('select, input[type="text"]');
                    inputs.forEach(function(el) {
                        el.addEventListener('change', autoSubmit);
                        el.addEventListener('input', function() {
                            // Debounce for text input
                            if (debounceTimer) clearTimeout(debounceTimer);
                            filtering.value = true;
                            debounceTimer = setTimeout(function() {
                                form.submit();
                            }, 600);
                        });
                    });
                });

                return { filtering: filtering, formEl: formEl, t: t };
            }
        }).mount('#vue-task-filter');
    })();
    </script>
</div>
</body>
</html>
