<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header rounded-3 mb-4">
        <div class="container-fluid">
            <h2><i class="fas" th:classappend="${project.id != null} ? 'fa-edit' : 'fa-plus'"></i>
                <span th:text="${project.id != null} ? #{project.edit} : #{project.create}"></span></h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="post" th:action="${project.id != null} ? @{/projects/{id}/edit(id=${project.id})} : @{/projects/create}">
                        <div class="mb-3">
                            <label class="form-label"><span th:text="#{project.name}">项目名称</span> <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg"
                                   th:value="${project.name}" th:placeholder="#{project.name.placeholder}" placeholder="输入项目名称" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{project.description}">项目描述</label>
                            <textarea name="description" class="form-control" rows="5"
                                      th:placeholder="#{project.description.placeholder}" placeholder="描述这个项目的目的和范围" maxlength="2000"
                                      th:text="${project.description}"></textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/projects}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> <span th:text="#{project.back}">返回</span>
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:text="${project.id != null} ? #{project.save} : #{project.create}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
