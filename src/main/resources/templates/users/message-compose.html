<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header-custom">
        <h2><i class="fas fa-pen"></i> 写消息</h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="@{/messages/compose}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">收件人</label>
                    <select name="recipientId" class="form-select" required>
                        <option value="">请选择收件人...</option>
                        <option th:each="u : ${users}" th:value="${u.id}"
                                th:text="${u.displayName + ' (' + u.username + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">主题</label>
                    <input type="text" name="subject" class="form-control" maxlength="200" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">内容</label>
                    <textarea name="content" class="form-control" rows="8" required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 发送</button>
                    <a th:href="@{/messages}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
