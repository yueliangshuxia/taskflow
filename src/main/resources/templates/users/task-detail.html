<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header rounded-3 mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="javascript:history.back()" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left"></i> <span th:text="#{common.back}">返回</span>
                </a>
                <div>
                    <h2 class="mb-0 text-white"><i class="fas fa-tasks"></i> <span th:text="${task.title}">任务标题</span></h2>
                    <p class="mb-0 text-white-50">
                        <a th:href="@{/projects/{id}(id=${task.projectId})}" class="text-white">
                            <i class="fas fa-folder-open"></i> <span th:text="${task.projectName}">所属项目</span>
                        </a>
                    </p>
                </div>
            </div>
            <div>
                <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-light btn-sm">
                    <i class="fas fa-edit"></i> <span th:text="#{task.edit}">编辑</span>
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-2 mb-3">
                        <span th:class="'badge rounded-pill badge-' + ${task.status.name().toLowerCase().replace('_', '-')} + ' fs-6'"
                              th:text="${task.status.displayName}">状态</span>
                        <span th:class="'badge rounded-pill badge-' + ${task.priority.name().toLowerCase() + ' fs-6'}"
                              th:text="${task.priority.displayName}">优先级</span>
                        <span th:if="${task.dueDate}" class="badge bg-info fs-6">
                            <i class="fas fa-calendar"></i> <span th:text="#{task.due}">截止</span>: <span th:text="${task.dueDate}">日期</span>
                        </span>
                    </div>

                    <h6 class="fw-bold" th:text="#{task.description}">描述</h6>
                    <p th:text="${task.description} ?: #{task.no.description}" class="text-muted"></p>

                    <div class="mt-3 p-3 bg-light rounded">
                        <label class="fw-bold mb-2"><i class="fas fa-sync"></i> <span th:text="#{task.status.update}">更新状态</span>:</label>
                        <select class="form-select form-select-sm w-auto status-select"
                                th:attr="data-task-id=${task.id}"
                                onchange="updateTaskStatus(this)">
                            <option th:each="s : ${T(com.taskflow.entity.enums.TaskStatus).values()}"
                                    th:value="${s.name()}"
                                    th:text="${s.displayName}"
                                    th:selected="${s.name() == task.status.name()}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-comments"></i> <span th:text="#{task.comments}">评论</span> (<span th:text="${#lists.size(comments)}">0</span>)</h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/tasks/{id}/comments(id=${task.id})}" class="mb-4">
                        <div class="mb-2">
                            <textarea name="content" class="form-control" rows="3"
                                      th:placeholder="#{task.comment.placeholder}" placeholder="输入评论..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-paper-plane"></i> <span th:text="#{task.comment.submit}">发表评论</span>
                        </button>
                    </form>

                    <th:block th:if="${#lists.isEmpty(comments)}">
                        <p class="text-muted text-center" th:text="#{task.no.comments}">暂无评论</p>
                    </th:block>
                    <div th:unless="${#lists.isEmpty(comments)}">
                        <div th:each="comment : ${comments}" class="comment-item">
                            <div class="d-flex justify-content-between">
                                <strong th:text="${comment.authorName}">作者</strong>
                                <small class="text-muted" th:text="${comment.createdAt}">时间</small>
                            </div>
                            <p class="mb-0" th:text="${comment.content}">内容</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-user"></i> <span th:text="#{task.assignee.info}">指派信息</span></h5>
                </div>
                <div class="card-body">
                    <p class="mb-1"><strong th:text="#{task.creator}">创建者：</strong><span th:text="${task.creatorName}">创建者</span></p>
                    <p class="mb-1"><strong th:text="#{task.assignee}">指派人：</strong>
                        <span th:text="${task.assigneeName} ?: #{task.no.assignee}" th:class="${task.assigneeName} ? '' : 'text-muted'"></span>
                    </p>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-cog"></i> <span th:text="#{task.actions}">操作</span></h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-edit"></i> <span th:text="#{task.edit}">编辑任务</span>
                        </a>
                        <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}"
                              th:onsubmit="'return confirm(\'' + #{task.delete.confirm} + '\')'">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                <i class="fas fa-trash"></i> <span th:text="#{task.delete}">删除任务</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-paperclip"></i> <span th:text="#{task.attachments}">附件</span></h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/tasks/{id}/attachments(id=${task.id})}"
                          enctype="multipart/form-data">
                        <div class="mb-2">
                            <input type="file" name="file" class="form-control form-control-sm">
                        </div>
                        <button type="submit" class="btn btn-outline-primary btn-sm w-100">
                            <i class="fas fa-upload"></i> <span th:text="#{task.upload.file}">上传文件</span>
                        </button>
                    </form>
                    <th:block th:if="${attachments != null and !#lists.isEmpty(attachments)}">
                        <hr>
                        <div th:each="att : ${attachments}" class="small">
                            <i class="fas fa-file"></i>
                            <span th:text="${att.fileName}">文件名</span>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateTaskStatus(select) {
            var taskId = select.dataset.taskId;
            var status = select.value;
            fetch('/api/tasks/' + taskId + '/status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [getCsrfHeader()]: getCsrfToken()
                },
                body: JSON.stringify({status: status})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    showToast('状态更新成功', 'success');
                } else {
                    showToast('更新失败: ' + data.message, 'danger');
                }
            })
            .catch(function() {
                showToast('请求失败', 'danger');
            });
        }
    </script>
</div>
</body>
</html>
