<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="page-header rounded-3 mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="javascript:history.back()" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left"></i> <span th:text="#{common.back}">返回</span>
                </a>
                <div>
                    <h2 class="mb-0 text-white"><i class="fas fa-tasks"></i> <span th:text="${task.title}">任务标题</span></h2>
                    <p class="mb-0 text-white-50">
                        <a th:href="@{/projects/{id}(id=${task.projectId})}" class="text-white">
                            <i class="fas fa-folder-open"></i> <span th:text="${task.projectName}">所属项目</span>
                        </a>
                    </p>
                </div>
            </div>
            <div>
                <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-light btn-sm">
                    <i class="fas fa-edit"></i> <span th:text="#{task.edit}">编辑</span>
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-2 mb-3">
                        <span th:class="'badge rounded-pill badge-' + ${task.status.name().toLowerCase().replace('_', '-')} + ' fs-6'"
                              th:text="${task.status.displayName}">状态</span>
                        <span th:class="'badge rounded-pill badge-' + ${task.priority.name().toLowerCase() + ' fs-6'}"
                              th:text="${task.priority.displayName}">优先级</span>
                        <span th:if="${task.dueDate}" class="badge bg-info fs-6">
                            <i class="fas fa-calendar"></i> <span th:text="#{task.due}">截止</span>: <span th:text="${task.dueDate}">日期</span>
                        </span>
                    </div>

                    <h6 class="fw-bold" th:text="#{task.description}">描述</h6>
                    <p th:text="${task.description} ?: #{task.no.description}" class="text-muted"></p>

                    <!-- Vue: Status Updater -->
                    <div id="vue-task-status"
                         class="mt-3 p-3 bg-light rounded"
                         data-task-id="${task.id}"
                         data-current-status="${task.status.name()}">
                        <label class="fw-bold mb-2"><i class="fas fa-sync"></i> <span th:text="#{task.status.update}">更新状态</span>:</label>
                        <div class="d-flex align-items-center gap-2">
                            <span :class="'badge rounded-pill fs-6 ' + statusBadgeClass(selected)">
                                {{ selectedLabel }}
                            </span>
                            <select v-model="selected" @change="updateStatus" class="form-select form-select-sm w-auto">
                                <option v-for="s in statusList" :value="s.value">{{ s.label }}</option>
                            </select>
                            <span v-if="saving" class="spinner-border spinner-border-sm text-primary"></span>
                            <span v-if="msg" :class="'small text-' + msgType">{{ msg }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vue: Comments -->
            <div id="vue-comments" class="card mb-3" data-task-id="${task.id}">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-comments"></i> <span th:text="#{task.comments}">评论</span>
                        <span class="badge bg-secondary rounded-pill ms-1">{{ comments.length }}</span>
                    </h5>
                </div>
                <div class="card-body">
                    <!-- Add Comment Form -->
                    <div class="mb-4">
                        <div class="mb-2">
                            <textarea v-model="newComment" class="form-control" rows="3"
                                      :placeholder="__('task.comment.placeholder', '输入评论...')"
                                      @keydown.ctrl.enter="submitComment"
                                      :disabled="sending"></textarea>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Ctrl+Enter 快捷发送</small>
                            <button @click="submitComment" :disabled="sending || !newComment.trim()" class="btn btn-primary btn-sm">
                                <i class="fas fa-paper-plane"></i>
                                <span v-if="sending" class="spinner-border spinner-border-sm"></span>
                                <span v-else th:text="#{task.comment.submit}">发表评论</span>
                            </button>
                        </div>
                    </div>

                    <!-- Loading -->
                    <div v-if="loading" class="text-center py-3">
                        <div class="spinner-border text-primary spinner-border-sm"></div>
                        <span class="ms-2 text-muted small">{{ __('common.loading', '加载中...') }}</span>
                    </div>

                    <!-- Error -->
                    <div v-else-if="loadError" class="alert alert-danger py-2 small">
                        <i class="fas fa-exclamation-circle"></i> {{ loadError }}
                        <button @click="fetchComments" class="btn btn-sm btn-outline-danger ms-2">
                            <i class="fas fa-redo"></i> {{ __('common.retry', '重试') }}
                        </button>
                    </div>

                    <!-- Empty -->
                    <div v-else-if="comments.length === 0" class="text-center py-4 text-muted">
                        <i class="fas fa-comment-dots fs-2 mb-2 d-block"></i>
                        <span th:text="#{task.no.comments}">暂无评论</span>
                    </div>

                    <!-- Comment List -->
                    <div v-else>
                        <div v-for="c in comments" :key="c.id" class="comment-item">
                            <div class="d-flex justify-content-between">
                                <strong>{{ c.authorName }}</strong>
                                <small class="text-muted">{{ c.createdAt }}</small>
                            </div>
                            <p class="mb-0" style="white-space: pre-wrap;">{{ c.content }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-user"></i> <span th:text="#{task.assignee.info}">指派信息</span></h5>
                </div>
                <div class="card-body">
                    <p class="mb-1"><strong th:text="#{task.creator}">创建者：</strong><span th:text="${task.creatorName}">创建者</span></p>
                    <p class="mb-1"><strong th:text="#{task.assignee}">指派人：</strong>
                        <span th:text="${task.assigneeName} ?: #{task.no.assignee}" th:class="${task.assigneeName} ? '' : 'text-muted'"></span>
                    </p>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-cog"></i> <span th:text="#{task.actions}">操作</span></h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-edit"></i> <span th:text="#{task.edit}">编辑任务</span>
                        </a>
                        <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}"
                              th:onsubmit="'return confirm(\'' + #{task.delete.confirm} + '\')'">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                <i class="fas fa-trash"></i> <span th:text="#{task.delete}">删除任务</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-paperclip"></i> <span th:text="#{task.attachments}">附件</span></h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/tasks/{id}/attachments(id=${task.id})}"
                          enctype="multipart/form-data">
                        <div class="mb-2">
                            <input type="file" name="file" class="form-control form-control-sm">
                        </div>
                        <button type="submit" class="btn btn-outline-primary btn-sm w-100">
                            <i class="fas fa-upload"></i> <span th:text="#{task.upload.file}">上传文件</span>
                        </button>
                    </form>
                    <th:block th:if="${attachments != null and !#lists.isEmpty(attachments)}">
                        <hr>
                        <div th:each="att : ${attachments}" class="small">
                            <i class="fas fa-file"></i>
                            <span th:text="${att.fileName}">文件名</span>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue Components -->
    <script>
    (function() {
        if (typeof Vue === 'undefined') return;
        var VueApp = Vue;

        var _t = window.__messages || {};

        function __(key, fallback) { return _t[key] || fallback || key; }

        // Status definitions
        var STATUS_LABELS = {
            'TODO': __('task.status.todo', 'TODO'),
            'IN_PROGRESS': __('task.status.in_progress', 'In Progress'),
            'IN_REVIEW': __('task.status.in_review', 'In Review'),
            'DONE': __('task.status.done', 'Done')
        };
        var STATUS_LIST = [
            { value: 'TODO', label: STATUS_LABELS['TODO'] },
            { value: 'IN_PROGRESS', label: STATUS_LABELS['IN_PROGRESS'] },
            { value: 'IN_REVIEW', label: STATUS_LABELS['IN_REVIEW'] },
            { value: 'DONE', label: STATUS_LABELS['DONE'] }
        ];

        function statusBadgeClass(status) {
            var map = { 'TODO': 'badge-todo', 'IN_PROGRESS': 'badge-in-progress', 'IN_REVIEW': 'badge-in-progress', 'DONE': 'badge-done' };
            return map[status] || 'badge-secondary';
        }

        // ====== Status Updater ======
        var statusEl = document.getElementById('vue-task-status');
        if (statusEl) {
            var taskId = statusEl.dataset.taskId;
            VueApp.createApp({
                setup: function() {
                    var selected = VueApp.ref(statusEl.dataset.currentStatus || 'TODO');
                    var saving = VueApp.ref(false);
                    var msg = VueApp.ref('');
                    var msgType = VueApp.ref('success');

                    var selectedLabel = VueApp.computed(function() {
                        return STATUS_LABELS[selected.value] || selected.value;
                    });

                    function updateStatus() {
                        saving.value = true;
                        msg.value = '';
                        var headers = {};
                        headers[getCsrfHeader()] = getCsrfToken();
                        headers['Content-Type'] = 'application/json';
                        fetch('/api/tasks/' + taskId + '/status', {
                            method: 'POST', headers: headers,
                            body: JSON.stringify({ status: selected.value })
                        })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            saving.value = false;
                            msg.value = data.success
                                ? __('task.update.success', '更新成功')
                                : (data.message || __('task.update.fail', '更新失败'));
                            msgType.value = data.success ? 'success' : 'danger';
                            if (typeof showToast === 'function') showToast(msg.value, msgType.value);
                            setTimeout(function() { msg.value = ''; }, 3000);
                        })
                        .catch(function() {
                            saving.value = false;
                            msg.value = __('task.request.fail', '请求失败');
                            msgType.value = 'danger';
                            setTimeout(function() { msg.value = ''; }, 3000);
                        });
                    }

                    return { selected: selected, saving: saving, msg: msg, msgType: msgType,
                             statusList: STATUS_LIST, selectedLabel: selectedLabel,
                             statusBadgeClass: statusBadgeClass, updateStatus: updateStatus };
                }
            }).mount('#vue-task-status');
        }

        // ====== Comments ======
        var commentsEl = document.getElementById('vue-comments');
        if (commentsEl) {
            var commentTaskId = commentsEl.dataset.taskId;
            VueApp.createApp({
                setup: function() {
                    var comments = VueApp.ref([]);
                    var newComment = VueApp.ref('');
                    var loading = VueApp.ref(true);
                    var loadError = VueApp.ref(null);
                    var sending = VueApp.ref(false);

                    function fetchComments() {
                        loading.value = true;
                        loadError.value = null;
                        var headers = { 'Accept': 'application/json' };
                        headers[getCsrfHeader()] = getCsrfToken();
                        fetch('/api/tasks/' + commentTaskId + '/comments', { headers: headers })
                        .then(function(r) { if (!r.ok) throw new Error('Load failed'); return r.json(); })
                        .then(function(data) { comments.value = data || []; loading.value = false; })
                        .catch(function(err) { loadError.value = err.message; loading.value = false; });
                    }

                    function submitComment() {
                        var content = newComment.value.trim();
                        if (!content || sending.value) return;
                        sending.value = true;
                        var headers = {};
                        headers[getCsrfHeader()] = getCsrfToken();
                        headers['Content-Type'] = 'application/json';
                        fetch('/api/tasks/' + commentTaskId + '/comments', {
                            method: 'POST', headers: headers,
                            body: JSON.stringify({ content: content })
                        })
                        .then(function(r) { if (!r.ok) throw new Error('Post failed'); return r.json(); })
                        .then(function(comment) {
                            comments.value = [comment].concat(comments.value);
                            newComment.value = '';
                            sending.value = false;
                            if (typeof showToast === 'function') showToast(__('common.success', '发布成功'), 'success');
                        })
                        .catch(function(err) {
                            sending.value = false;
                            if (typeof showToast === 'function') showToast(err.message || __('task.update.fail', '发布失败'), 'danger');
                        });
                    }

                    VueApp.onMounted(fetchComments);
                    return { comments: comments, newComment: newComment, loading: loading,
                             loadError: loadError, sending: sending, __: __,
                             fetchComments: fetchComments, submitComment: submitComment };
                }
            }).mount('#vue-comments');
        }
    })();
    </script>
</div>
</body>
</html>
