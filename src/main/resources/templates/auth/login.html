<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-xl">
                    <div class="card-header text-center pt-4">
                        <div class="mb-3">
                            <span style="font-size: 3rem; color: #4f46e5;"><i class="fas fa-tasks"></i></span>
                        </div>
                        <h3 class="fw-bold">TaskFlow</h3>
                        <p class="text-muted">任务管理系统</p>
                    </div>
                    <div class="card-body p-4">
                        <th:block th:if="${param.error}">
                            <div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> 用户名或密码错误</div>
                        </th:block>
                        <th:block th:if="${param.logout}">
                            <div class="alert alert-success"><i class="fas fa-check-circle"></i> 您已成功退出登录</div>
                        </th:block>
                        <th:block th:if="${param.registered}">
                            <div class="alert alert-success"><i class="fas fa-check-circle"></i> 注册成功，请登录</div>
                        </th:block>
                        <th:block th:if="${param.expired}">
                            <div class="alert alert-warning"><i class="fas fa-clock"></i> 会话已过期，请重新登录</div>
                        </th:block>

                        <form method="post" th:action="@{/login}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-user text-primary"></i> 用户名</label>
                                <input type="text" name="username" class="form-control form-control-lg"
                                       placeholder="请输入用户名" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-lock text-primary"></i> 密码</label>
                                <input type="password" name="password" class="form-control form-control-lg"
                                       placeholder="请输入密码" required>
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" name="remember-me" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">记住我（7天免登录）</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-sign-in-alt"></i> 登录
                                </button>
                            </div>
                            <div class="text-end mt-2">
                                <a th:href="@{/forgot-password}" class="text-muted small">忘记密码？</a>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0 text-muted">还没有账号？ <a th:href="@{/register}" class="text-primary fw-bold">立即注册</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
