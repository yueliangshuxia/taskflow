<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-xl">
                    <div class="card-header text-center pt-4">
                        <div class="mb-3">
                            <span style="font-size: 3rem; color: #4f46e5;"><i class="fas fa-lock"></i></span>
                        </div>
                        <h3 class="fw-bold">重置密码</h3>
                        <p class="text-muted">请设置新密码</p>
                    </div>
                    <div class="card-body p-4">
                        <th:block th:if="${error}">
                            <div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>
                        </th:block>
                        <form th:if="${token != null}" method="post" th:action="@{/reset-password}">
                            <input type="hidden" name="token" th:value="${token}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-lock text-primary"></i> 新密码</label>
                                <input type="password" name="password" class="form-control form-control-lg"
                                       placeholder="请输入新密码" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-lock text-primary"></i> 确认密码</label>
                                <input type="password" name="confirmPassword" class="form-control form-control-lg"
                                       placeholder="请再次输入新密码" required minlength="6">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save"></i> 重置密码
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <a th:href="@{/login}" class="text-primary"><i class="fas fa-arrow-left"></i> 返回登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
