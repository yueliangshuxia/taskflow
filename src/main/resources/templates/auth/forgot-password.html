<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.forgot.page.title}">忘记密码 - TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-xl">
                    <div class="card-header text-center pt-4">
                        <div class="mb-3">
                            <span style="font-size: 3rem; color: #4f46e5;"><i class="fas fa-key"></i></span>
                        </div>
                        <h3 class="fw-bold" th:text="#{auth.forgot.title}">忘记密码</h3>
                        <p class="text-muted" th:text="#{auth.forgot.subtitle}">输入注册邮箱以重置密码</p>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" th:action="@{/forgot-password}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-envelope text-primary"></i> <span th:text="#{auth.forgot.email}">邮箱</span></label>
                                <input type="email" name="email" class="form-control form-control-lg"
                                       th:placeholder="#{auth.forgot.email.placeholder}" placeholder="请输入注册邮箱" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-paper-plane"></i> <span th:text="#{auth.forgot.submit}">发送重置链接</span>
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <a th:href="@{/login}" class="text-primary"><i class="fas fa-arrow-left"></i> <span th:text="#{common.back.to.login}">返回登录</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
