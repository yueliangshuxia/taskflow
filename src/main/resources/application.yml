server:
  port: 8080
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: taskflow
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/taskflow?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  thymeleaf:
    cache: false
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  messages:
    basename: messages
    encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  upload-dir: ${user.dir}/uploads
  max-file-size: 10485760
  allowed-extensions: pdf,doc,docx,xls,xlsx,png,jpg,jpeg,gif,zip,txt

logging:
  level:
    com.taskflow: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  file:
    name: logs/taskflow.log
    max-size: 10MB
    max-history: 7
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  thymeleaf:
    cache: true

logging:
  level:
    com.taskflow: INFO
